<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Precios | Chiringuito El Estacio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
  <style>
    * { font-family: 'Montserrat', sans-serif; }
    .serif-title { font-family: 'Playfair Display', serif; }
  </style>
</head>
<body class="bg-stone-900 text-stone-100 min-h-screen font-sans">

  <!-- MODAL LOGIN -->
  <div id="login-modal" class="fixed inset-0 bg-stone-950/90 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="bg-white text-stone-900 w-full max-w-sm p-6 rounded-2xl shadow-2xl border border-stone-200">
      <div class="text-center mb-5">
        <h2 class="serif-title text-xl font-black text-stone-900">El Estacio Playa</h2>
        <p class="text-xs text-stone-500 font-bold uppercase tracking-wider mt-1">Panel de Control de Precios</p>
      </div>
      <form onsubmit="handleLogin(event)" class="space-y-3">
        <div>
          <label class="block text-[11px] font-bold uppercase tracking-wider text-stone-500 mb-1">Usuario</label>
          <input id="user-input" type="text" placeholder="chiringuitoestacio" required class="w-full bg-stone-50 border border-stone-200 rounded-xl px-3 py-2 text-sm font-medium outline-none focus:border-[#c98a42]">
        </div>
        <div>
          <label class="block text-[11px] font-bold uppercase tracking-wider text-stone-500 mb-1">Contraseña</label>
          <input id="pass-input" type="password" placeholder="10000" required class="w-full bg-stone-50 border border-stone-200 rounded-xl px-3 py-2 text-sm font-medium outline-none focus:border-[#c98a42]">
        </div>
        <p id="login-error" class="text-xs font-bold text-red-500 hidden text-center">Usuario o contraseña incorrectos</p>
        <button type="submit" class="w-full bg-[#c98a42] hover:bg-[#b57933] text-white font-bold py-2.5 rounded-xl transition text-sm">
          Entrar al Panel
        </button>
      </form>
    </div>
  </div>

  <!-- PANEL ADMIN -->
  <div id="admin-panel" class="hidden">
    <header class="border-b border-stone-800 bg-stone-900/90 backdrop-blur-md sticky top-0 z-40">
      <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
        <div>
          <h1 class="serif-title text-lg font-bold text-white">Chiringuito El Estacio <span class="text-[#c98a42]">Playa</span></h1>
          <p class="text-[11px] text-stone-400">Modifica precios, añade o borra platos en tiempo real</p>
        </div>
        <div class="flex items-center gap-3">
          <a href="lacarta.html" target="_blank" class="bg-[#c98a42] hover:bg-[#b57933] text-white font-bold text-xs px-3.5 py-2 rounded-xl transition flex items-center gap-1.5">
            Ver Carta Pública ↗
          </a>
          <button onclick="logout()" class="text-xs text-stone-400 hover:text-red-400 font-bold px-2 py-1 transition">Salir</button>
        </div>
      </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 py-6 grid grid-cols-1 lg:grid-cols-12 gap-6">
      
      <!-- FORMULARIO AÑADIR -->
      <section class="lg:col-span-4 bg-white text-stone-900 p-5 rounded-2xl shadow-xl border border-stone-100 h-fit">
        <h2 class="text-sm font-extrabold uppercase tracking-wider text-stone-900 mb-3 text-[#c98a42]">➕ Añadir Producto</h2>
        <form onsubmit="handleAddProduct(event)" class="space-y-3">
          <div>
            <label class="block text-[10px] font-bold uppercase text-stone-500 mb-1">Categoría</label>
            <select id="prod-category" class="w-full bg-stone-50 border border-stone-200 rounded-xl px-3 py-2 text-xs font-semibold outline-none focus:border-[#c98a42]">
              <option value="tapas">Tapas / Snacks</option>
              <option value="raciones">Raciones</option>
              <option value="ensaladas">Ensaladas / Salad</option>
              <option value="pescados">Pescados</option>
              <option value="platos-fuertes">Platos Fuertes / Main Courses</option>
              <option value="refrescos">Refrescos / Cold Drinks</option>
              <option value="cervezas">Cervezas / Beers</option>
              <option value="vino">Vinos / Wine</option>
              <option value="cocktails">Cocktail / Cocktail</option>
              <option value="alcohol">Alcohol / Spirits</option>
              <option value="cafes">Cafés / Coffee</option>
              <option value="postres">Carta de Postres</option>
            </select>
          </div>

          <div>
            <label class="block text-[10px] font-bold uppercase text-stone-500 mb-1">Nombre</label>
            <input id="prod-name" type="text" placeholder="Ej: Espeto de Sardinas" required class="w-full bg-stone-50 border border-stone-200 rounded-xl px-3 py-2 text-xs font-medium outline-none focus:border-[#c98a42]">
          </div>

          <div>
            <label class="block text-[10px] font-bold uppercase text-stone-500 mb-1">Descripción / Inglés</label>
            <input id="prod-desc" type="text" placeholder="Ej: Grilled sardines on skewer" class="w-full bg-stone-50 border border-stone-200 rounded-xl px-3 py-2 text-xs font-medium outline-none focus:border-[#c98a42]">
          </div>

          <div>
            <label class="block text-[10px] font-bold uppercase text-stone-500 mb-1">Precio (€)</label>
            <input id="prod-price" type="text" placeholder="Ej: 7,50 €" required class="w-full bg-stone-50 border border-stone-200 rounded-xl px-3 py-2 text-xs font-bold text-[#c98a42] outline-none focus:border-[#c98a42]">
          </div>

          <button type="submit" class="w-full bg-[#c98a42] hover:bg-[#b57933] text-white font-bold py-2.5 rounded-xl transition text-xs uppercase tracking-wider">
            Guardar en Carta
          </button>
        </form>
      </section>

      <!-- LISTADO CON EDICIÓN Y BORRADO -->

        <div class="flex items-center justify-between flex-wrap gap-2">
          <div class="flex items-center gap-1.5 overflow-x-auto pb-1 max-w-full text-xs">
            <select id="filter-select" onchange="changeFilter(this.value)" class="bg-stone-800 text-white font-bold text-xs px-3 py-2 rounded-xl border border-stone-700 outline-none">

              <option value="tapas">Tapas</option>
              <option value="raciones">Raciones</option>
              <option value="ensaladas">Ensaladas</option>

              <option value="vino">Vinos</option>
              <option value="cocktails">Cocktails</option>
              <option value="alcohol">Alcohol / Copas</option>
              <option value="cafes">Cafés</option>
              <option value="postres">Postres</option>
            </select>
          </div>
          <button onclick="restoreDefaultMenu()" class="text-xs text-stone-400 hover:text-amber-400 underline">Restaurar Carta Original</button>
        </div>

        <div id="admin-dishes-list" class="space-y-2"></div>
      </section>

    </main>
  </div>

    let currentFilter = "all";

    function checkAuth() {
      if (sessionStorage.getItem('estacio_auth') === 'true') {
        document.getElementById('login-modal').classList.add('hidden');
        document.getElementById('admin-panel').classList.remove('hidden');
        renderList();
      }
    }

    function handleLogin(e) {
      e.preventDefault();
      const user = document.getElementById('user-input').value.trim();
      const pass = document.getElementById('pass-input').value.trim();

      if (user === 'chiringuitoestacio' && pass === '10000') {
        sessionStorage.setItem('estacio_auth', 'true');
        document.getElementById('login-modal').classList.add('hidden');
        document.getElementById('admin-panel').classList.remove('hidden');
        renderList();
      } else {
        document.getElementById('login-error').classList.remove('hidden');
      }
    }

    function logout() {
      sessionStorage.removeItem('estacio_auth');
      window.location.reload();
    }

    function getMenu() {
      const stored = localStorage.getItem('estacio_carta_datos');
      if (!stored) {
        localStorage.setItem('estacio_carta_datos', JSON.stringify(defaultData));
        return defaultData;
      }
      try {
        return JSON.parse(stored);
      } catch(e) {
        return defaultData;
      }
    }

    function saveMenu(data) {
      localStorage.setItem('estacio_carta_datos', JSON.stringify(data));
    }

    function handleAddProduct(e) {
      e.preventDefault();
      const cat = document.getElementById('prod-category').value;
      const nombre = document.getElementById('prod-name').value.trim();
      const desc = document.getElementById('prod-desc').value.trim();
      let precio = document.getElementById('prod-price').value.trim();
      if (!precio.includes('€')) precio += ' €';

      const menu = getMenu();
      if (!menu[cat]) {
        menu[cat] = { titulo: cat.toUpperCase(), platos: [] };
      }

      menu[cat].platos.unshift({ nombre, desc, precio });
      saveMenu(menu);
      e.target.reset();
      renderList();
    }

    // Actualiza en tiempo real según tecleas
    function updatePrice(cat, index, newPrice) {
      const menu = getMenu();
      if (menu[cat] && menu[cat].platos && menu[cat].platos[index]) {
        let val = newPrice.trim();
        if (val && !val.includes('€')) val += ' €';
        menu[cat].platos[index].precio = val || newPrice;
        saveMenu(menu);
      }
    }

    function deleteProduct(cat, index) {
      if (!confirm('¿Seguro que quieres borrar este plato?')) return;
      const menu = getMenu();
      if (menu[cat] && menu[cat].platos) {
        menu[cat].platos.splice(index, 1);
        saveMenu(menu);
        renderList();
      }
    }

    function changeFilter(val) {
      currentFilter = val;
      renderList();
    }

    function restoreDefaultMenu() {
      if (confirm('¿Restaurar todos los platos y precios originales de la carta?')) {
        localStorage.setItem('estacio_carta_datos', JSON.stringify(defaultData));
        renderList();
      }
    }

    function renderList() {
      const menu = getMenu();
      const container = document.getElementById('admin-dishes-list');
      container.innerHTML = '';

      let categories = Object.keys(menu);
      if (currentFilter !== 'all') {
        categories = categories.filter(c => c === currentFilter);
      }

      categories.forEach(catKey => {
        const catData = menu[catKey];
        if (!catData || !catData.platos || catData.platos.length === 0) return;

        const catTitle = document.createElement('div');
        catTitle.className = "pt-2 pb-1 text-xs font-bold uppercase tracking-wider text-[#c98a42] border-b border-stone-800 flex justify-between";
        catTitle.innerHTML = `<span>${catData.titulo}</span> <span class="text-stone-500 font-normal">(${catData.platos.length})</span>`;
        container.appendChild(catTitle);

        catData.platos.forEach((plato, idx) => {
          const row = document.createElement('div');
          row.className = "bg-white text-stone-900 px-3.5 py-2.5 rounded-xl flex items-center justify-between gap-3 shadow-sm border border-stone-100";
          row.innerHTML = `
            <div class="min-w-0">
              <h4 class="font-bold text-xs sm:text-sm text-stone-900 truncate">${plato.nombre}</h4>
              <p class="text-[11px] text-stone-500 truncate">${plato.desc || 'Sin descripción'}</p>
            </div>

            <div class="flex items-center gap-2 shrink-0">
              <div class="flex items-center bg-stone-100 rounded-lg px-2 py-1 border border-stone-200 focus-within:border-[#c98a42]">
                <input 
                  type="text" 
                  value="${plato.precio}" 
                  oninput="updatePrice('${catKey}', ${idx}, this.value)" 
                  class="w-20 bg-transparent font-black text-xs sm:text-sm text-[#c98a42] outline-none text-right"
                >
              </div>

              <button onclick="deleteProduct('${catKey}', ${idx})" class="text-red-500 hover:text-red-700 bg-red-50 hover:bg-red-100 p-1.5 rounded-lg text-xs font-bold transition" title="Borrar plato">
                🗑️
              </button>
            </div>
          `;
          container.appendChild(row);
        });
      });
    }

    checkAuth();
  </script>
</body>
</html>
